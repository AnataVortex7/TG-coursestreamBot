<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asme — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-blur: 18px;
      --glass-border: rgba(255,255,255,0.9);
      --glass-shadow: 0 8px 40px rgba(120,150,255,0.12), inset 0 1px 1px rgba(255,255,255,0.95);
      --accent: #6c8ef5;
      --accent2: #b48cf7;
      --text: #1a1a2e;
      --muted: #6b7280;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0e8ff 0%, #f3ecff 35%, #fce4f0 65%, #e8f4ff 100%);
      overflow: hidden;
      position: relative;
    }

    /* Animated mesh orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-1 { width: 520px; height: 520px; background: radial-gradient(circle, #a5b8ff 0%, #c4b5fd 100%); top: -120px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, #fbcfe8 0%, #fda4af 100%); bottom: -80px; right: -80px; animation-delay: -4s; }
    .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, #bae6fd 0%, #a5f3fc 100%); bottom: 80px; left: 60px; animation-delay: -8s; }
    .orb-4 { width: 250px; height: 250px; background: radial-gradient(circle, #d9f99d 0%, #a3e635 100%); top: 120px; right: 120px; animation-delay: -3s; opacity: 0.3; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(30px, -30px) scale(1.06); }
      100% { transform: translate(-20px, 20px) scale(0.96); }
    }

    /* Noise grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* Liquid glass mixin */
    .glass {
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      border: none;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }
    .glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(
        160deg,
        rgba(255,255,255,0.95) 0%,
        rgba(255,255,255,0.5) 25%,
        rgba(255,255,255,0.1) 50%,
        rgba(255,255,255,0.4) 75%,
        rgba(255,255,255,0.9) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 1;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 48px 44px 44px;
      position: relative;
      z-index: 10;
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(108,142,245,0.35);
    }
    .logo-icon svg { stroke: white; }
    .logo-name {
      font-family: 'Instrument Serif', serif;
      font-size: 1.6rem;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    /* Headings */
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      color: var(--text);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 36px;
      font-weight: 400;
    }
    .subtitle a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .subtitle a:hover { text-decoration: underline; }

    /* Labels */
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    /* Input fields */
    .field { margin-bottom: 18px; }

    .input-wrap {
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 50px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 2px 12px rgba(108,142,245,0.08);
      transition: box-shadow 0.2s, background 0.2s;
      position: relative;
    }
    .input-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      padding: 1px;
      background: linear-gradient(160deg, rgba(255,255,255,0.95) 0%, rgba(200,200,255,0.3) 50%, rgba(255,255,255,0.7) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .input-wrap:focus-within {
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), 0 0 0 3px rgba(108,142,245,0.18), 0 2px 12px rgba(108,142,245,0.12);
      background: rgba(255,255,255,0.75);
    }
    .input-wrap svg {
      flex-shrink: 0;
      stroke: var(--muted);
      opacity: 0.7;
    }
    .input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--text);
    }
    .input-wrap input::placeholder { color: #9ca3af; }

    /* Password toggle */
    .toggle-pw {
      background: none; border: none; cursor: pointer; padding: 0;
      display: flex; align-items: center;
      color: var(--muted); opacity: 0.7;
      transition: opacity 0.15s;
    }
    .toggle-pw:hover { opacity: 1; }

    /* Forgot */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 26px;
    }
    .forgot-row a {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-row a:hover { text-decoration: underline; }

    /* Submit button */
    .btn-primary {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(108,142,245,0.38), inset 0 1px 1px rgba(255,255,255,0.25);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 60%);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 32px rgba(108,142,245,0.45), inset 0 1px 1px rgba(255,255,255,0.25);
    }
    .btn-primary:active { transform: translateY(0); opacity: 0.9; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 14px;
      margin: 24px 0;
    }
    .divider span {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 500;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(0,0,0,0.08);
    }

    /* Social buttons */
    .socials { display: flex; gap: 12px; }
    .btn-social {
      flex: 1;
      height: 46px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06), inset 0 1px 1px rgba(255,255,255,0.9);
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      position: relative;
    }
    .btn-social::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      padding: 1px;
      background: linear-gradient(160deg, rgba(255,255,255,0.95) 0%, rgba(200,200,255,0.2) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .btn-social:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); background: rgba(255,255,255,0.8); }

    /* Google G icon */
    .g-icon { width: 18px; height: 18px; }

    /* Floating badge */
    .floating-badge {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      border-radius: 50px;
      padding: 10px 22px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      animation: badgeIn 0.6s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes badgeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-16px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .badge-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 3px rgba(74,222,128,0.25);
    }
  </style>
</head>
<body>

  <!-- Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>

  <!-- Top badge -->
  <div class="floating-badge glass">
    <div class="badge-dot"></div>
    Secure · End-to-end encrypted
  </div>

  <!-- Login card -->
  <div class="card glass">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <span class="logo-name">Asme</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">New here? <a href="#">Create an account →</a></p>

    <!-- Email -->
    <div class="field">
      <label for="email">Email</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
        </svg>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
    </div>

    <!-- Password -->
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        <button class="toggle-pw" onclick="togglePw()" aria-label="Toggle password">
          <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="forgot-row"><a href="#">Forgot password?</a></div>

    <!-- Submit -->
    <button class="btn-primary" onclick="handleLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      Sign in to Asme
    </button>

    <!-- Divider -->
    <div class="divider"><span>or continue with</span></div>

    <!-- Social -->
    <div class="socials">
      <button class="btn-social" aria-label="Continue with Google">
        <!-- Google G -->
        <svg class="g-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button class="btn-social" aria-label="Continue with GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1a1a2e" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </button>
    </div>
  </div>

  <script>
    function togglePw() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      }
    }

    function handleLogin() {
      const btn = document.querySelector('.btn-primary');
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.7s linear infinite"><path d="M21 12a9 9 0 1 1-9-9"/></svg> Signing in…`;
      setTimeout(() => {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Welcome back!`;
        btn.style.background = 'linear-gradient(135deg, #4ade80 0%, #22c55e 100%)';
      }, 1400);
    }
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
</body>
</html>
