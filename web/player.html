<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/static/base.css">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{ .title }}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: var(--text);
    font-family: var(--font-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
    user-select: none;
  }

  /* ── Player wrapper ── */
  #player-wrap {
    position: relative;
    width: 100%;
    max-width: 960px;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.8);
  }

  /* ── The actual video ── */
  #vid {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16/9; 
    background: #000;
    /* Disable browser's built-in download / picture-in-picture */
    -webkit-media-controls-panel: none;
  }

  /* ── Overlay (blocks right-click save-video) ── */
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    cursor: pointer;
  }

  /* ── Controls bar ── */
  #controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 3;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 28px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  #player-wrap.show-controls #controls { opacity: 1; }

  /* Progress bar */
  #progress-wrap {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    cursor: pointer;
    /* Expand touch area above/below the 4px bar */
    padding: 8px 0;
    margin: -8px 0;
  }
  #progress-wrap:hover { height: 6px; }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    width: 0%;
    pointer-events: none;
  }
  #progress-wrap input[type=range] {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    margin: 0;
  }

  /* Buttons row */
  #btn-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .ctrl-btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    min-width: 44px;
    min-height: 44px;
    opacity: 0.9;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .ctrl-btn:hover { opacity: 1; transform: scale(1.1); }
  .ctrl-btn:active { opacity: 0.7; transform: scale(0.95); }

  #time-display {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* Volume */
  #vol-wrap { display: flex; align-items: center; gap: 6px; }
  #vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 70px;
    height: 3px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  #vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  /* Mobile: volume API blocked — hide slider */
  @media (max-width: 600px) {
    #vol-wrap { display: none; }
  }

  /* Speed */
  #speed-btn {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
  }
  #speed-btn:hover { background: rgba(255,255,255,0.2); }

  /* Spacer */
  .spacer { flex: 1; }

  /* Title bar */
  #title-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 3;
    background: linear-gradient(rgba(0,0,0,0.7), transparent);
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    opacity: 0;
    transition: opacity 0.25s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #player-wrap.show-controls #title-bar { opacity: 1; }

  /* Mobile info section safe area */
  #info-panel, .info-section, .next-files {
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }

  /* Mobile: slightly bigger controls */
  @media (max-width: 600px) {
    #controls { padding: 20px 12px 10px; gap: 6px; }
    #btn-row { gap: 12px; }
    #speed-btn { font-size: 11px; padding: 4px 7px; }
    #time-display { font-size: 11px; }
  }

  /* Loading spinner */
  #spinner {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    pointer-events: none;
  }
  #spinner.hidden { display: none; }
  .spin {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Play icon flash */
  #play-flash {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  #play-flash span {
    font-size: 56px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
  }

  /* ── Fullscreen ── */
  #player-wrap:fullscreen,
  #player-wrap:-webkit-full-screen,
  #player-wrap:-moz-full-screen {
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    border-radius: 0;
  }
  #player-wrap:fullscreen #vid,
  #player-wrap:-webkit-full-screen #vid,
  #player-wrap:-moz-full-screen #vid {
    width: 100vw;
    height: 100vh;
    max-height: 100vh;
    object-fit: contain;
  }
  #player-wrap:fullscreen #controls,
  #player-wrap:-webkit-full-screen #controls,
  #player-wrap:-moz-full-screen #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 9999;
  }

  /* ── PDF section ── */
  #pdf-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    padding: 40px 20px;
    text-align: center;
  }
  #pdf-icon { font-size: 4rem; margin-bottom: 12px; }
  #pdf-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 8px;
    word-break: break-word;
    max-width: 480px;
  }
  #pdf-hint {
    font-size: 0.82rem;
    color: #6b7280;
    margin-bottom: 28px;
  }
  #pdf-btns {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #pdf-open, #pdf-download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s, transform 0.1s;
  }
  #pdf-open {
    background: rgba(99,102,241,0.22);
    color: #a5b4fc;
    border: 1px solid rgba(99,102,241,0.45);
  }
  #pdf-open:hover { background: rgba(99,102,241,0.38); transform: translateY(-1px); }
  #pdf-download {
    background: rgba(16,185,129,0.15);
    color: #6ee7b7;
    border: 1px solid rgba(16,185,129,0.35);
  }
  #pdf-download:hover { background: rgba(16,185,129,0.28); transform: translateY(-1px); }


  /* Below player: back link */
  #below {
    max-width: 960px;
    width: 100%;
    padding: 10px 4px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #back-link {
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    font-size: 12px;
    transition: color 0.2s;
  }
  #back-link:hover { color: #fff; }

  /* ── Resume toast ── */
  #resume-toast {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(18, 18, 28, 0.96);
    border: 1px solid rgba(124, 106, 247, 0.45);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 260px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
  }
  #resume-toast.hidden { display: none !important; }
  #resume-toast p {
    font-size: 13px;
    color: rgba(255,255,255,0.75);
    margin: 0;
    text-align: center;
  }
  #resume-toast-btns {
    display: flex;
    gap: 10px;
  }
  #btn-resume {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  #btn-resume:hover { background: #6254d4; }
  #btn-restart {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #btn-restart:hover { background: rgba(255,255,255,0.15); }

  /* ── Floating watermark ── */
  #watermark {
    position: absolute;
    z-index: 6;
    pointer-events: none;
    font-size: 16px;
    font-weight: 700;
    color: rgba(255,255,255,0.45);
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    white-space: nowrap;
    user-select: none;
    transition: top 0.8s cubic-bezier(0.4,0,0.2,1),
                left 0.8s cubic-bezier(0.4,0,0.2,1);
    letter-spacing: 0.3px;
  }

  /* ── Double-tap seek indicators ── */
  .seek-flash {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 6;
    width: 40%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #seek-flash-left  { left: 0;  border-radius: 0 80% 80% 0 / 0 50% 50% 0; background: rgba(255,255,255,0.12); }
  #seek-flash-right { right: 0; border-radius: 80% 0 0 80% / 50% 0 0 50%; background: rgba(255,255,255,0.12); }
  .seek-flash.active { opacity: 1; transition: opacity 0s; }
  .seek-flash-icon {
    font-size: 28px;
    filter: drop-shadow(0 1px 6px rgba(0,0,0,0.9));
  }
  .seek-flash-label {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.9));
  }
</style>
</head>
<body>

<div id="player-wrap">

  <div id="title-bar">{{ .title }}</div>

  {{ if eq .mediaType "pdf" }}
    <!-- PDF actions -->
    <div id="pdf-wrap">
      <div id="pdf-icon">📄</div>
      <div id="pdf-name">{{ .title }}</div>
      <div id="pdf-hint">PDF file — खाली बटण दाबून उघडा किंवा डाउनलोड करा</div>
      <div id="pdf-btns">
        <a id="pdf-open" href="{{ .viewURL }}" target="_blank">📖 PDF उघडा</a>
        <a id="pdf-download" href="{{ .downloadURL }}" download="{{ .title }}.pdf">⬇️ Download</a>
      </div>
    </div>

  {{ else if eq .mediaType "image" }}
    <!-- Image viewer -->
    <div id="image-wrap" style="display:flex;align-items:center;justify-content:center;min-height:60vh;background:#111;padding:16px;">
      <img id="preview-img"
        src="{{ .streamURL }}"
        alt="{{ .title }}"
        style="max-width:100%;max-height:80vh;object-fit:contain;border-radius:6px;user-select:none;"
        oncontextmenu="return false"
        draggable="false"
      />
    </div>

  {{ else }}
    <!-- Video / Audio player -->
    <video id="vid"
      src="{{ .streamURL }}"
      controlsList="nodownload noremoteplayback"
      disablePictureInPicture
      preload="metadata"
      playsinline
    ></video>

    <div id="overlay"></div>
    <div id="spinner"><div class="spin"></div></div>
    <div id="play-flash"><span id="flash-icon">▶</span></div>

    {{ if .watermark }}
    <div id="watermark">{{ .watermark }}</div>
    {{ end }}

    <!-- Double-tap seek indicators -->
    <div id="seek-flash-left"  class="seek-flash">
      <span class="seek-flash-icon">⏪</span>
      <span class="seek-flash-label">-10 sec</span>
    </div>
    <div id="seek-flash-right" class="seek-flash">
      <span class="seek-flash-icon">⏩</span>
      <span class="seek-flash-label">+10 sec</span>
    </div>


    <!-- Resume toast — shown when saved position exists -->
    <div id="resume-toast" class="hidden">
      <p id="resume-msg">▶ Resume from <strong id="resume-time">0:00</strong></p>
      <div id="resume-toast-btns">
        <button id="btn-resume">Resume</button>
        <button id="btn-restart">Start over</button>
      </div>
    </div>

    <div id="controls">
      <div id="progress-wrap">
        <div id="progress-fill"></div>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1"/>
      </div>
      <div id="btn-row">
        <button class="ctrl-btn" id="btn-play" title="Play/Pause">▶</button>
        <div id="vol-wrap">
          <button class="ctrl-btn" id="btn-mute" title="Mute">🔊</button>
          <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1"/>
        </div>
        <span id="time-display">0:00 / 0:00</span>
        <div class="spacer"></div>
        <button id="speed-btn" title="Playback speed">1×</button>
        <button class="ctrl-btn" id="btn-fs" title="Fullscreen">⛶</button>
      </div>
    </div>
  {{ end }}

</div>

<div id="below">
  <a id="back-link" href="/courses">← Back</a>
</div>

<script>
(function () {
  'use strict';

  // ── Server-injected data ───────────────────────────────────────────────────
  const RESUME_POSITION = parseFloat('{{ .resumePosition }}') || 0;
  const WATCH_TOKEN     = '{{ .watchToken }}';

  // ── Watermark — दर 3 सेकंदाला random position वर हलवतो ───────────────────
  const wmEl = document.getElementById('watermark');
  if (wmEl) {
    const playerWrap = document.getElementById('player-wrap');
    function moveWatermark() {
      const pw  = playerWrap.offsetWidth  || 640;
      const ph  = playerWrap.offsetHeight || 360;
      const wmW = wmEl.offsetWidth  || 260;
      const wmH = wmEl.offsetHeight || 18;
      const x = 10 + Math.random() * Math.max(10, pw - wmW - 20);
      const y = 30 + Math.random() * Math.max(10, ph - wmH - 70);
      wmEl.style.left = x + 'px';
      wmEl.style.top  = y + 'px';
    }
    moveWatermark();
    setInterval(moveWatermark, 3000);
  }

  // ── Back button — referrer → history → /courses fallback ──────────────────
  const backLink = document.getElementById('back-link');
  if (backLink) {
    const ref = document.referrer;
    if (ref && ref.startsWith(location.origin) && !ref.includes('/watch/') && !ref.includes('/watch-stream/')) {
      // came from a page on the same site (e.g. course detail) — go back there
      backLink.href = ref;
    } else if (history.length > 1) {
      // has browser history — use history.back()
      backLink.href = 'javascript:void(0)';
      backLink.addEventListener('click', () => history.back());
    } else {
      // no history, no referrer — go to courses list
      backLink.href = '/courses';
    }
  }


  document.addEventListener('contextmenu', e => e.preventDefault());

  const vid = document.getElementById('vid');
  if (!vid) return; // image or PDF — no video controls needed

  const wrap     = document.getElementById('player-wrap');
  const overlay  = document.getElementById('overlay');
  const spinner  = document.getElementById('spinner');
  const flash    = document.getElementById('play-flash');
  const flashIco = document.getElementById('flash-icon');
  const seek     = document.getElementById('seek');
  const fill     = document.getElementById('progress-fill');
  const timeLbl  = document.getElementById('time-display');
  const btnPlay  = document.getElementById('btn-play');
  const btnMute  = document.getElementById('btn-mute');
  const volSlide = document.getElementById('vol-slider');
  const speedBtn = document.getElementById('speed-btn');
  const btnFS    = document.getElementById('btn-fs');

  // ── Helpers ────────────────────────────────────────────────────────────────
  function fmt(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function flashAnim(icon) {
    flashIco.textContent = icon;
    flash.style.opacity = '1';
    flash.style.transition = 'none';
    setTimeout(() => {
      flash.style.transition = 'opacity 0.5s';
      flash.style.opacity = '0';
    }, 50);
  }

  // ── Play / Pause ───────────────────────────────────────────────────────────
  function togglePlay() {
    if (vid.paused) { vid.play(); flashAnim('▶'); }
    else            { vid.pause(); flashAnim('⏸'); }
  }

  // ── Double-tap seek (left = -10s, right = +10s) ───────────────────────────
  const seekFlashLeft  = document.getElementById('seek-flash-left');
  const seekFlashRight = document.getElementById('seek-flash-right');

  function showSeekFlash(side) {
    const el = side === 'left' ? seekFlashLeft : seekFlashRight;
    el.classList.add('active');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('active'), 600);
  }

  let tapTimer = null;
  let tapCount = 0;
  let tapSide  = null;

  overlay.addEventListener('click', (e) => {
    const rect = overlay.getBoundingClientRect();
    const side = (e.clientX - rect.left) < rect.width / 2 ? 'left' : 'right';

    tapCount++;
    tapSide = side;

    if (tapCount === 1) {
      tapTimer = setTimeout(() => {
        if (tapCount === 1) togglePlay();  // single tap → play/pause
        tapCount = 0;
        tapSide  = null;
      }, 250);
    } else if (tapCount >= 2) {
      clearTimeout(tapTimer);
      tapCount = 0;
      if (tapSide === 'left') {
        vid.currentTime = Math.max(0, vid.currentTime - 10);
        showSeekFlash('left');
      } else {
        vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 10);
        showSeekFlash('right');
      }
      tapSide = null;
    }
  });

  btnPlay.addEventListener('click', togglePlay);

  vid.addEventListener('play',  () => { btnPlay.textContent = '⏸'; });
  vid.addEventListener('pause', () => { btnPlay.textContent = '▶'; });

  // ── Progress ───────────────────────────────────────────────────────────────
  // ── Auto-save position (every 10s) ────────────────────────────────────────
  let lastSavedAt = 0;
  function savePosition(seconds) {
    if (!WATCH_TOKEN) return;
    fetch('/api/watch/position/' + WATCH_TOKEN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ position: seconds }),
      credentials: 'same-origin',
    }).catch(() => {}); // silent fail — non-critical
  }

  vid.addEventListener('timeupdate', () => {
    if (!vid.duration) return;
    const pct = (vid.currentTime / vid.duration) * 100;
    fill.style.width = pct + '%';
    seek.value = pct;
    timeLbl.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);

    // Auto-save every 10s
    const now = Date.now();
    if (now - lastSavedAt > 10000) {
      lastSavedAt = now;
      // 95%+ = video complete, save 0 (next open starts fresh)
      savePosition(pct >= 95 ? 0 : vid.currentTime);
    }
  });

  // Save on page unload (tab close / navigation)
  window.addEventListener('beforeunload', () => {
    if (!vid.duration || vid.currentTime < 5) return;
    const pct = (vid.currentTime / vid.duration) * 100;
    savePosition(pct >= 95 ? 0 : vid.currentTime);
  });

  seek.addEventListener('input', () => {
    if (vid.duration) vid.currentTime = (seek.value / 100) * vid.duration;
  });

  // ── Volume ─────────────────────────────────────────────────────────────────
  volSlide.addEventListener('input', () => {
    vid.volume = volSlide.value;
    vid.muted = (vid.volume === 0);
    btnMute.textContent = vid.muted ? '🔇' : '🔊';
  });

  btnMute.addEventListener('click', () => {
    vid.muted = !vid.muted;
    btnMute.textContent = vid.muted ? '🔇' : '🔊';
    volSlide.value = vid.muted ? 0 : vid.volume;
  });

  // ── Speed ──────────────────────────────────────────────────────────────────
  const speeds = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  let speedIdx = 2;
  speedBtn.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    vid.playbackRate = speeds[speedIdx];
    speedBtn.textContent = speeds[speedIdx] + '×';
  });

  // ── Fullscreen ─────────────────────────────────────────────────────────────
  // ── Fullscreen ─────────────────────────────────────────────────────────────
  btnFS.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      wrap.requestFullscreen && wrap.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    btnFS.textContent = document.fullscreenElement ? '✕' : '⛶';
    if (document.fullscreenElement) {
      // Mobile var landscape lock karo (Android Chrome)
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } else {
      // Fullscreen exit — orientation release karo
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }
  });

  // ── Keyboard shortcuts ─────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    switch(e.code) {
      case 'Space': e.preventDefault(); togglePlay(); break;
      case 'ArrowRight': vid.currentTime = Math.min(vid.duration, vid.currentTime + 10); break;
      case 'ArrowLeft':  vid.currentTime = Math.max(0, vid.currentTime - 10); break;
      case 'ArrowUp':    vid.volume = Math.min(1, vid.volume + 0.1); volSlide.value = vid.volume; break;
      case 'ArrowDown':  vid.volume = Math.max(0, vid.volume - 0.1); volSlide.value = vid.volume; break;
      case 'KeyF':       btnFS.click(); break;
      case 'KeyM':       btnMute.click(); break;
    }
  });

  // ── Spinner ────────────────────────────────────────────────────────────────
  // ── Spinner ────────────────────────────────────────────────────────────────
  vid.addEventListener('waiting',  () => spinner.classList.remove('hidden'));
  vid.addEventListener('canplay',  () => spinner.classList.add('hidden'));
  vid.addEventListener('playing',  () => spinner.classList.add('hidden'));

  // ── Video error handler ────────────────────────────────────────────────────
  // Fires when the server returns a non-video response (e.g. HTTP 429 stream
  // limit, 403 session expired). Without this, the spinner spins forever and
  // the user sees no message — the browser silently fails to decode HTML as video.
  vid.addEventListener('error', async () => {
    spinner.classList.add('hidden');

    let msg = 'Could not load the video. Please reload the page and try again.';
    try {
      // A HEAD fetch reads the status code without downloading the body.
      const resp = await fetch(vid.src, { method: 'HEAD', credentials: 'same-origin' });
      if (resp.status === 429) {
        msg = '⚠️ Another stream is already active on your account. Please close other tabs and try again.';
      } else if (resp.status === 403) {
        msg = '🔒 Your session has expired. Please log in again.';
      } else if (resp.status === 404) {
        msg = '❌ File not found. Please go back and try a different video.';
      }
    } catch (_) { /* network error — keep generic message */ }

    // Inject error overlay inside the p
    // Inject error overlay inside the player wrapper
    let errDiv = document.getElementById('stream-error-overlay');
    if (!errDiv) {
      errDiv = document.createElement('div');
      errDiv.id = 'stream-error-overlay';
      errDiv.style.cssText = [
        'position:absolute', 'inset:0', 'z-index:20',
        'display:flex', 'flex-direction:column',
        'align-items:center', 'justify-content:center',
        'background:rgba(0,0,0,0.88)',
        'color:#f87171', 'font-size:14px',
        'font-weight:600', 'text-align:center',
        'padding:24px', 'gap:14px',
      ].join(';');
      wrap.appendChild(errDiv);
    }
    errDiv.innerHTML = `
      <span style="font-size:2.2rem">⛔</span>
      <span>${msg}</span>
      <button onclick="location.reload()"
        style="margin-top:6px;padding:8px 22px;background:var(--accent);color:#fff;
               border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;">
        Reload
      </button>`;
    errDiv.style.display = 'flex';
  });
  vid.addEventListener('loadeddata', () => {
    spinner.classList.add('hidden');

    // ── Resume toast ─────────────────────────────────────────────────────────
    if (RESUME_POSITION > 5) {
      const toast    = document.getElementById('resume-toast');
      const timeSpan = document.getElementById('resume-time');
      const btnRes   = document.getElementById('btn-resume');
      const btnRst   = document.getElementById('btn-restart');

      // Seek to saved position, keep paused
      vid.currentTime = RESUME_POSITION;
      timeSpan.textContent = fmt(RESUME_POSITION);
      toast.classList.remove('hidden');
      wrap.classList.add('show-controls');

      btnRes.addEventListener('click', () => {
        toast.classList.add('hidden');
        vid.play();
      });
      btnRst.addEventListener('click', () => {
        toast.classList.add('hidden');
        vid.currentTime = 0;
        savePosition(0); // clear saved position
        vid.play();
      });
    }
  });

  // ── Auto-hide controls ─────────────────────────────────────────────────────
  let hideTimer;
  function resetHide() {
    wrap.classList.add('show-controls');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!vid.paused) wrap.classList.remove('show-controls');
    }, 2500);
  }
  wrap.addEventListener('mousemove', resetHide);
  wrap.addEventListener('touchstart', resetHide);
  vid.addEventListener('pause', () => wrap.classList.add('show-controls'));
  vid.addEventListener('play',  resetHide);

  // ── Prevent drag-to-save on the video ──────────────────────────────────────
  vid.addEventListener('dragstart', e => e.preventDefault());

})();
</script>

<script>
(function(){
'use strict';

function _redirect(){
  try{ window.location.replace('https://www.google.com'); }catch(e){}
}

function _isMobile(){
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth <= 768;
}

function _sizeDetect(){
  if(_isMobile()) return false;
  return (window.outerWidth  - window.innerWidth  > 130) ||
         (window.outerHeight - window.innerHeight > 130);
}

function _debuggerDetect(){
  var t = performance.now();
  (function(){ debugger; })();
  return (performance.now() - t) > 100;
}

function _check(){
  if(_sizeDetect() || _debuggerDetect()) _redirect();
}

// ── 1. Check INSTANTLY before page even renders ───────────────────
// Runs in <head> or top of body — catches "DevTools already open" case
_check();

// ── 2. Check again on DOMContentLoaded ───────────────────────────
document.addEventListener('DOMContentLoaded', function(){ _check(); });

// ── 3. Check on full load ─────────────────────────────────────────
window.addEventListener('load', function(){ _check(); });

// ── 4. Poll every 300ms forever ───────────────────────────────────
setInterval(_check, 300);

// ── Keyboard shortcuts → instant redirect ────────────────────────
document.addEventListener('keydown', function(e){
  if(e.keyCode === 123){ e.preventDefault(); _redirect(); return false; }
  if(e.ctrlKey && e.shiftKey && [73,74,67,75].indexOf(e.keyCode) !== -1){ e.preventDefault(); _redirect(); return false; }
  if(e.ctrlKey && e.keyCode === 85){ e.preventDefault(); return false; }
  if(e.metaKey && e.altKey && e.keyCode === 73){ e.preventDefault(); _redirect(); return false; }
}, true);

// ── Right-click block ─────────────────────────────────────────────
document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; }, true);

})();
</script>
